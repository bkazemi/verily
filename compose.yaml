services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: verily
      POSTGRES_PASSWORD: verily
      POSTGRES_DB: verily
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - verily-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verily']
      interval: 2s
      retries: 15
volumes:
  verily-db:
